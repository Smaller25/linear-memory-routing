# ---------------------------------------------------------------------------
# Diverse-key NIAH (added for the diverse-key ReLU routing experiment,
# sh_exp/diverse-key-niah-relu). Straight extension of niah_multikey_1 along
# its own num_needle_k axis: N distinct keys each carry ONE "special magic
# number" needle, the query asks about exactly ONE of them (num_needle_q=1).
# essay = PaulGraham haystack (niah_multikey lineage); noise variants use the
# repeated-sentence haystack (niah_single_1 lineage). All other generation
# parameters (needle template, words keys, numbers values) are unchanged so
# the annotation regex and string_match scoring stay compatible.

niah_diversekey_essay_1:
  task: niah
  args:
    type_haystack: essay
    type_needle_k: words
    type_needle_v: numbers
    num_needle_k: 1
    num_needle_v: 1
    num_needle_q: 1

